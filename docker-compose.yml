services:
  angular:
    networks:
      - balance
    depends_on:
      - node
    env_file:
      - .env.local.secrets
    build:
      context: ./client
      dockerfile: ./Dockerfile.dev
      secrets:
        - npmrc
    ports:
      - "4200:4200"
      - "49153:49153"
    develop:
      watch:
        - action: sync
          path: ./client
          target: /app
  node:
    networks:
      - balance
    depends_on:
      - mongo
    env_file:
      - .env.local.secrets
    build:
      context: ./api
      dockerfile: ./Dockerfile.dev
      secrets: 
        - npmrc
    ports:
      - "3000:3000"
    develop:
      watch:
        - action: sync
          path: ./api/src
          target: /app/src

  mongo:
    networks:
      - balance
    image: mongo:6
    container_name: mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:

secrets:
  npmrc:
    file: ~/.npmrc

networks:
  balance:
    name: balance
