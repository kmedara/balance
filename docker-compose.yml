services:
  angular:
    networks:
      - balance
    depends_on:
      - node
    build:
      context: ./client
      dockerfile: ./Dockerfile.dev
      secrets:
        - npmrc
    ports:
      - "4200:4200"
      - "49153:49153"
    environment:
      - GATEWAY=${GATEWAY}
      - AUTH_DISABLED=${AUTH_DISABLED:-true}
      - COGNITO_AUTHORITY=${COGNITO_AUTHORITY:-}
      - COGNITO_CLIENT_ID=${COGNITO_CLIENT_ID:-}
      - COGNITO_REDIRECT_URI=${COGNITO_REDIRECT_URI:-http://localhost:4200/auth/callback}
      - COGNITO_LOGOUT_URI=${COGNITO_LOGOUT_URI:-http://localhost:4200/}
    develop:
      watch:
        - action: sync
          path: ./client
          target: /app
  node:
    networks:
      - balance
    depends_on:
      - mongo
    build:
      context: ./api
      dockerfile: ./Dockerfile.dev
      secrets: 
        - npmrc
    ports:
      - "3000:3000"
    environment:
      - PLAID_CLIENT_ID=${PLAID_CLIENT_ID}
      - PLAID_SECRET=${PLAID_SECRET}
      - PLAID_PRODUCTS=${PLAID_PRODUCTS}
      - PLAID_HOST=${PLAID_HOST}
      - PLAID_COUNTRY_CODES=${PLAID_COUNTRY_CODES}
      - PLAID_ENV=${PLAID_ENV}
      - PLAID_CLIENT_NAME=${PLAID_CLIENT_NAME}
      - PLAID_REDIRECT_URI=${PLAID_REDIRECT_URI}
      - MONGO_URL=${MONGO_URL}
      - AUTH_DISABLED=${AUTH_DISABLED:-true}
      - COGNITO_USER_POOL_ID=${COGNITO_USER_POOL_ID:-}
      - COGNITO_CLIENT_ID=${COGNITO_CLIENT_ID:-}
      - COGNITO_REGION=${COGNITO_REGION:-}
      - ACCESS_TOKEN_ENCRYPTION_KEY=${ACCESS_TOKEN_ENCRYPTION_KEY}
      - ACCESS_TOKEN_ENCRYPTION_ALGORITHM=${ACCESS_TOKEN_ENCRYPTION_ALGORITHM}
      - ACCESS_TOKEN_ENCRYPTION_KEY_VERSION=${ACCESS_TOKEN_ENCRYPTION_KEY_VERSION}
      - ACCESS_TOKEN_ENCRYPTION_IV_LENGTH=${ACCESS_TOKEN_ENCRYPTION_IV_LENGTH}
    develop:
      watch:
        - action: sync
          path: ./api/src
          target: /app/src

  mongo:
    networks:
      - balance
    image: mongo:6
    container_name: mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:

secrets:
  npmrc:
    file: ~/.npmrc

networks:
  balance:
    name: balance
