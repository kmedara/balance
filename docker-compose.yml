services:
  angular:
    networks:
      - balance
    depends_on:
      - node
    env_file:
      - .env.local.secrets
    build:
      context: .
      dockerfile: client/Dockerfile.dev
    ports:
      - '4200:4200'
      - '49153:49153'
    develop:
      watch:
        - action: sync
          path: ./client
          target: /app/client
        - action: sync
          path: ./packages/domain
          target: /app/packages/domain
  node:
    replicas: 2
    networks:
      - balance
    depends_on:
      - dynamodb
    env_file:
      - .env.local.secrets
    environment:
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      BALANCE_TABLE: balance
    build:
      context: .
      dockerfile: api/Dockerfile.dev
    ports:
      - '3000:3000'
    develop:
      watch:
        - action: sync
          path: ./api/src
          target: /app/api/src
        - action: sync
          path: ./packages/domain
          target: /app/packages/domain

  dynamodb:
    networks:
      - balance
    image: amazon/dynamodb-local:latest
    container_name: dynamodb
    restart: always
    user: root
    working_dir: /home/dynamodblocal
    ports:
      - '8000:8000'
    command: ['-jar', 'DynamoDBLocal.jar', '-sharedDb', '-dbPath', './data']
    volumes:
      - dynamodb-data:/home/dynamodblocal/data

networks:
  balance:
    name: balance

volumes:
  dynamodb-data:
