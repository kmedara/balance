@if (visible()) {
  <div
    class="modal-shell-backdrop"
    (click)="onBackdropClick()"
    (keydown.escape)="onBackdropClick()"
  ></div>

  <div
    class="modal-shell-panel"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="headerText"
    (click)="$event.stopPropagation()"
  >
    <header class="modal-shell-header">
      @if (isHeaderString()) {
        <h2 class="modal-shell-title">{{ headerText }}</h2>
      } @else if (isHeaderComponent()) {
        <ng-container *ngComponentOutlet="headerComponent"></ng-container>
      }
      <button
        mat-icon-button
        type="button"
        class="modal-shell-close"
        aria-label="Close"
        (click)="onVisibleChange(false)"
      >
        <mat-icon>close</mat-icon>
      </button>
    </header>

    <div class="modal-shell-body" #contentHost></div>
  </div>
}
