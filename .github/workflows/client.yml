name: Client

on:
  push:
    branches:
      - master
    paths:
      - 'client/**'
      - 'packages/domain/**'
      - 'packages/schemas/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/client.yml'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'API base URL baked into the client (GATEWAY)'
        required: false
        type: string

concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  CDK_DEFAULT_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  GATEWAY: ${{ inputs.api_base_url || vars.API_BASE_URL }}

jobs:
  deploy:
    name: Build & deploy client
    environment: development
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate configuration
        run: |
          if [ -z "$GATEWAY" ]; then
            echo "::error::Set repository variable API_BASE_URL (or provide api_base_url input) to the API Gateway URL."
            exit 1
          fi
          if [ -z "${{ secrets.AWS_DEPLOY_ROLE_ARN }}" ]; then
            echo "::error::Set secret AWS_DEPLOY_ROLE_ARN (deploy BalanceGitHubOidcStack first)."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build client (production)
        working-directory: client
        env:
          BUILD_CONFIGURATION: production
        run: npm run build -- --configuration production

      - name: Build infrastructure
        working-directory: infrastructure
        run: npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: balance-client-${{ github.run_id }}

      - name: Set CDK deploy target
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          echo "CDK_DEFAULT_ACCOUNT=$ACCOUNT" >> "$GITHUB_ENV"

      - name: Deploy client stack
        working-directory: infrastructure
        run: npm run deploy:client

      - name: Resolve stack outputs
        id: outputs
        working-directory: infrastructure
        run: |
          BUCKET=$(node -p "require('./cdk-outputs.client.json').BalanceClientStack.BucketName")
          DISTRIBUTION=$(node -p "require('./cdk-outputs.client.json').BalanceClientStack.DistributionId")
          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"
          echo "distribution=$DISTRIBUTION" >> "$GITHUB_OUTPUT"

      - name: Sync build output to S3
        run: |
          aws s3 sync client/dist/balance/browser "s3://${{ steps.outputs.outputs.bucket }}" \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html"
          aws s3 cp client/dist/balance/browser/index.html \
            "s3://${{ steps.outputs.outputs.bucket }}/index.html" \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.outputs.outputs.distribution }}" \
            --paths "/*"
