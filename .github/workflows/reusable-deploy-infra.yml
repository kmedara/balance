name: Reusable — deploy infrastructure

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment name (staging | production)
        required: true
        type: string
      callback_urls:
        description: Cognito callback URLs override (JSON or comma-separated)
        required: false
        type: string
        default: ''
      logout_urls:
        description: Cognito logout URLs override (JSON or comma-separated)
        required: false
        type: string
        default: ''
    outputs:
      api_base_url:
        description: Public API base URL from BalanceApiStack (client GATEWAY)
        value: ${{ jobs.deploy.outputs.api_base_url }}

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  CDK_DEFAULT_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  deploy:
    name: Deploy Database + Auth + API
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    outputs:
      api_base_url: ${{ steps.api_url.outputs.api_base_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require OIDC deploy role
        env:
          ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "::error::Set environment secret AWS_DEPLOY_ROLE_ARN for '${{ inputs.environment }}' (OIDC only; no access-key fallback)."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: |
          npm run build -w @balance/schemas
          npm run build -w @balance/domain

      - name: Build infrastructure
        working-directory: infrastructure
        run: npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: balance-infra-${{ inputs.environment }}-${{ github.run_id }}

      - name: Set CDK deploy target
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          echo "CDK_DEFAULT_ACCOUNT=$ACCOUNT" >> "$GITHUB_ENV"
          echo "Deploying to account $ACCOUNT in $AWS_REGION (${{ inputs.environment }})"

      - name: CDK bootstrap
        working-directory: infrastructure
        run: npx cdk bootstrap "aws://${CDK_DEFAULT_ACCOUNT}/${CDK_DEFAULT_REGION}"

      - name: CDK deploy
        working-directory: infrastructure
        env:
          CALLBACK_URLS: ${{ inputs.callback_urls || vars.COGNITO_CALLBACK_URLS }}
          LOGOUT_URLS: ${{ inputs.logout_urls || vars.COGNITO_LOGOUT_URLS }}
        run: |
          CONTEXT_ARGS=()
          if [ -n "$CALLBACK_URLS" ]; then
            CONTEXT_ARGS+=(-c "callbackUrls=${CALLBACK_URLS}")
          fi
          if [ -n "$LOGOUT_URLS" ]; then
            CONTEXT_ARGS+=(-c "logoutUrls=${LOGOUT_URLS}")
          fi
          npm run deploy:ci -- "${CONTEXT_ARGS[@]}"

      - name: Resolve API URL
        id: api_url
        working-directory: infrastructure
        run: |
          API_URL=$(node -p "require('./cdk-outputs.json').BalanceApiStack.ApiUrl")
          API_URL="${API_URL%/}"
          if [ -z "$API_URL" ] || [ "$API_URL" = "undefined" ]; then
            echo "::error::BalanceApiStack.ApiUrl missing from cdk-outputs.json"
            exit 1
          fi
          echo "api_base_url=$API_URL" >> "$GITHUB_OUTPUT"
          echo "Client GATEWAY will be $API_URL"

      - name: Upload stack outputs
        uses: actions/upload-artifact@v4
        with:
          name: cdk-outputs-${{ inputs.environment }}
          path: infrastructure/cdk-outputs.json
          retention-days: 30
