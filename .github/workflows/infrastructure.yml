name: Infrastructure

on:
  pull_request:
    paths:
      - 'infrastructure/**'
      - 'api/src/**'
      - 'packages/domain/**'
      - 'packages/schemas/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/infrastructure.yml'
  push:
    branches:
      - master
    paths:
      - 'infrastructure/**'
      - 'api/src/**'
      - 'packages/domain/**'
      - 'packages/schemas/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/infrastructure.yml'
  workflow_dispatch:
    inputs:
      callback_urls:
        description: 'OAuth callback URLs (JSON array or comma-separated)'
        required: false
        type: string
      logout_urls:
        description: 'OAuth logout URLs (JSON array or comma-separated)'
        required: false
        type: string

concurrency:
  group: infrastructure-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  CDK_DEFAULT_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  COGNITO_CALLBACK_URLS: ${{ inputs.callback_urls || vars.COGNITO_CALLBACK_URLS || '["http://localhost:3000/auth/callback"]' }}
  COGNITO_LOGOUT_URLS: ${{ inputs.logout_urls || vars.COGNITO_LOGOUT_URLS || '["http://localhost:4200/"]' }}

jobs:
  validate:
    name: Validate CDK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        working-directory: infrastructure
        run: npm run build

      - name: Synth
        working-directory: infrastructure
        run: npm run synth

  deploy:
    name: Deploy CDK - Development
    environment: development
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve AWS authentication method
        id: aws_auth
        env:
          ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
        run: |
          if [ -n "$ROLE_ARN" ]; then
            echo "method=oidc" >> "$GITHUB_OUTPUT"
            echo "Using OIDC role authentication"
          elif [ -n "$ACCESS_KEY" ]; then
            echo "method=keys" >> "$GITHUB_OUTPUT"
            echo "Using access key authentication (fallback)"
          else
            echo "::error::No AWS credentials configured."
            echo "Set secret AWS_DEPLOY_ROLE_ARN (recommended) after deploying BalanceGitHubOidcStack,"
            echo "or set AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY as repository/environment secrets."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        working-directory: infrastructure
        run: npm run build

      - name: Configure AWS credentials (OIDC)
        if: steps.aws_auth.outputs.method == 'oidc'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: balance-github-${{ github.run_id }}

      - name: Configure AWS credentials (access keys)
        if: steps.aws_auth.outputs.method == 'keys'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set CDK deploy target
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          echo "CDK_DEFAULT_REGION=$AWS_REGION" >> "$GITHUB_ENV"
          echo "CDK_DEFAULT_ACCOUNT=$ACCOUNT" >> "$GITHUB_ENV"
          echo "Deploying BalanceAuthStack and BalanceApiStack to account $ACCOUNT in $AWS_REGION"

      - name: CDK bootstrap
        working-directory: infrastructure
        run: npx cdk bootstrap "aws://${CDK_DEFAULT_ACCOUNT}/${CDK_DEFAULT_REGION}"

      - name: CDK diff
        working-directory: infrastructure
        run: npm run diff

      - name: CDK deploy
        working-directory: infrastructure
        run: npm run deploy:ci

      - name: Upload stack outputs
        uses: actions/upload-artifact@v4
        with:
          name: cdk-outputs
          path: infrastructure/cdk-outputs.json
          retention-days: 30

      - name: Print Cognito outputs
        working-directory: infrastructure
        run: |
          echo "Cognito stack outputs:"
          cat cdk-outputs.json
